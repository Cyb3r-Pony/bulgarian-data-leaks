<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="6" fill="#0b0e13"/>
  <!-- Database cylinder outline (cyan) -->
  <ellipse cx="16" cy="10" rx="9" ry="3.5" fill="rgba(34,211,238,0.08)" stroke="#22d3ee" stroke-width="1.4"/>
  <line x1="7" y1="10" x2="7" y2="22" stroke="#22d3ee" stroke-width="1.4"/>
  <line x1="25" y1="10" x2="25" y2="22" stroke="#22d3ee" stroke-width="1.4"/>
  <ellipse cx="16" cy="22" rx="9" ry="3.5" fill="rgba(34,211,238,0.08)" stroke="#22d3ee" stroke-width="1.4"/>
  <!-- Middle horizontal stripe -->
  <ellipse cx="16" cy="16" rx="9" ry="3.5" fill="none" stroke="#22d3ee" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.5"/>
  <!-- Red crack / leak line through the database -->
  <path d="M15 6.5 L12 13 L16.5 13 L13.5 25.5" stroke="#ff2b3d" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Red drip drop at bottom -->
  <circle cx="13" cy="28" r="1.8" fill="#ff2b3d"/>
</svg>
